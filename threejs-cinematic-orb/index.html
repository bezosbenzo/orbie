<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cinematic Orb | Three.js</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#050713;color:#eaf1ff;font-family:Inter,system-ui,sans-serif}canvas{display:block}header{position:absolute;top:32px;left:36px;z-index:2;pointer-events:none}h1{font-size:clamp(22px,4vw,42px);letter-spacing:.08em;margin:0;font-weight:600}p{opacity:.55;font-size:12px;letter-spacing:.2em;text-transform:uppercase}footer{position:absolute;bottom:24px;left:36px;font-size:12px;opacity:.5;pointer-events:none}
</style>
</head>
<body><header><h1>CHROMATIC / 01</h1><p>Interactive kinetic sculpture</p></header><footer>Move pointer to orbit · Scroll to zoom</footer>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#050713');scene.fog=new THREE.FogExp2('#050713',.045);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(0,0,8);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.5;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=4;controls.maxDistance=15;
scene.add(new THREE.AmbientLight(0x879acb,1.1));
function light(color,intensity,x,y,z){const l=new THREE.PointLight(color,intensity,20);l.position.set(x,y,z);scene.add(l)}light(0x4c9bff,110,-3,2,3);light(0xe253e9,90,3,-2,1);light(0x52ffe3,45,1,3,-3);
const group=new THREE.Group();scene.add(group);
const core=new THREE.Mesh(new THREE.IcosahedronGeometry(1.55,16),new THREE.MeshPhysicalMaterial({color:0x4760b6,metalness:.65,roughness:.14,clearcoat:1,clearcoatRoughness:.08,iridescence:1,iridescenceIOR:1.4,iridescenceThicknessRange:[100,700]}));group.add(core);
const wire=new THREE.Mesh(new THREE.IcosahedronGeometry(1.73,5),new THREE.MeshBasicMaterial({color:0x88c8ff,wireframe:true,transparent:true,opacity:.09}));group.add(wire);
for(let i=0;i<3;i++){const ring=new THREE.Mesh(new THREE.TorusGeometry(2.2+i*.25,.012,8,220),new THREE.MeshBasicMaterial({color:[0x66baff,0xdd73ff,0x6dffe1][i],transparent:true,opacity:.65}));ring.rotation.set(i*.75+.3,i*.8+.4,i*.6);group.add(ring)}
const count=900;const positions=new Float32Array(count*3);for(let i=0;i<count;i++){const r=4+Math.random()*14,a=Math.random()*Math.PI*2,z=(Math.random()-.5)*14;positions.set([Math.cos(a)*r,Math.sin(a)*r,z],i*3)}const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));scene.add(new THREE.Points(geometry,new THREE.PointsMaterial({color:0x7a9bcf,size:.018,transparent:true,opacity:.7})));
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();core.rotation.y=t*.16;core.rotation.x=Math.sin(t*.23)*.12;wire.rotation.y=-t*.09;group.rotation.z=Math.sin(t*.18)*.08;group.position.y=Math.sin(t*.7)*.09;controls.update();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
